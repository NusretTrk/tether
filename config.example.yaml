# Copy to config.yaml to customize (config.yaml is gitignored, edit freely).
# Also editable live from Telegram via /settings — changes there rewrite this file.
# Invalid values fall back to the default below with a logged warning, not a crash.

language: en                    # en | tr | de | es
output_mode: summary            # live | summary | quiet | verbose
confirm_before_send: true       # stage Send/Edit/Cancel buttons before delivering a typed message

claude_window_keyword: Claude   # substring used to find the Claude Desktop window
avd_window_keyword: Emulator    # substring used to find the Android emulator window

temp_check_interval_sec: 300    # how often to sample CPU/GPU temperature
temp_report_every_n_checks: 3   # send a summary report every N checks
temp_emergency_c: 90            # push an immediate alert at/above this temperature

usage_limit_check_interval_sec: 300
usage_limit_confirm_streak: 3   # consecutive detections required before alerting (filters OCR flicker)

# If Claude's usage-limit message gives a reset time, tether waits until then
# (plus the delay below, as a safety margin) and automatically sends a
# message to resume the session. Set to false to only be notified, never
# auto-resumed.
usage_limit_continue_enabled: true
usage_limit_continue_delay_sec: 60
usage_limit_continue_max_attempts: 3          # per attempt window, caps a bad-parse retry loop
usage_limit_continue_attempt_window_sec: 21600

stream_edit_throttle_sec: 2.5   # minimum seconds between message edits while streaming
transcript_poll_interval_sec: 1.0
uia_poll_interval_sec: 3.0

dialog_watch_enabled: true      # alert on popups/dialogs (e.g. "sign in again")
activity_watch_enabled: true    # notify when a Running session goes Idle

# Named keypad profiles for controlling other apps — /keys <name> shows
# one, targeting whatever window title contains window_keyword. Every key
# is still checked against ClaudeDesktopTarget.is_valid_key_spec no matter
# what's listed here (single keys, or safe modifier+key chords like
# ctrl+s) — this only controls what's offered as a shortcut.
#
# The same profile names also work with /target <name> to route plain
# text/photo messages there instead of Claude Desktop - e.g. /target cursor
# then just type normally to send it into Cursor's chat instead. /target
# claude switches back. This is lower-fidelity than Claude Desktop's own
# handling (no verified delivery, no OCR-located input box - it just
# focuses the window and pastes), so add input_click: {x, y} - a
# window-relative percentage (0-1) of where to click before pasting.
#
# input_click is effectively always worth setting, not just for a "hard"
# multi-panel app. Confirmed live against both Cursor and Antigravity:
# a fresh Cursor window happened to already have its Agent chat focused
# and worked without a click - but that turned out to be leftover state
# from whatever was focused before, not something Cursor guarantees. The
# next test (after clicking into Cursor's terminal for an unrelated
# check) sent the exact same message straight into the terminal instead,
# where it ran as a failed shell command. Antigravity needed the click
# from the very first try - its Agent panel never had default focus.
# Only skip input_click for something that's ALWAYS the sole input in its
# window, like a dedicated terminal app with nothing else in it.
#
# IMPORTANT if you calibrate these yourself: use a window with an ACTUAL
# conversation in it, not a fresh empty panel. Both Cursor and Antigravity
# put the input box right below the panel title when there's no history
# yet, then anchor it to the BOTTOM of the panel once there's a real
# conversation - completely normal chat-UI behavior, but it means a
# coordinate captured against an empty panel silently stops working the
# moment a real conversation exists, which is most of the time in
# practice. The values below were captured with a live conversation
# already in progress, for exactly this reason.
#
# model_click works the same way (window-relative x/y) for the /model
# picker button - opens it, OCRs the visible option text, clicks whichever
# line matches your /model argument. Only worth setting where the picker
# is actually usable: confirmed live that Cursor's is paywalled ("Upgrade
# to unlock premium models" on a free-tier account) - clicking it just
# pops an upsell, not a model list, so there's no model_click for cursor
# below. Antigravity's opened a real list every time.
#
# Uncomment and adjust to match your setup:
#
# keypad_profiles:
#   cursor:
#     window_keyword: "Cursor"
#     # Verified live, WITH a conversation already in the panel (see the
#     # note above on why that matters).
#     input_click:
#       x: 0.878
#       y: 0.910
#     keys:
#       Accept: tab
#       Reject: escape
#       "1": "1"
#       "2": "2"
#       Undo: ctrl+z
#       Save: ctrl+s
#   terminal:
#     window_keyword: "Windows Terminal"
#     keys:
#       "Ctrl+C": ctrl+c
#       Enter: enter
#       Up: up
#       Down: down
#   antigravity:
#     window_keyword: "Antigravity"
#     # Verified live, WITH a conversation already in the panel.
#     input_click:
#       x: 0.919
#       y: 0.910
#     # Verified live: opens a real model list (Gemini 3.7/3.6/3.5 Flash,
#     # Gemini 3.1 Pro, Claude Sonnet/Opus 4.6, GPT-OSS 120B were all seen
#     # on this account) and /model <partial name> correctly switches it.
#     model_click:
#       x: 0.9014
#       y: 0.943
#     keys:
#       Accept: tab
#       Reject: escape
#       Yes: "y"
#       No: "n"
